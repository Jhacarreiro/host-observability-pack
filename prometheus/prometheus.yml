global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: observer-agent
    static_configs:
      - targets: ["127.0.0.1:9199"]
